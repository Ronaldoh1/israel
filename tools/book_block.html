<!--BOOK-START-->
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* ===== Book mode: The Israel Architecture, read as a book ===== */
#bookView{color-scheme:light;--paper:#FBF9F4;--ink:#1C1B19;--muted:#5F5A52;--rule:#E3DED3;--accent:#8A2D1F;--fig:#1B2A4A;--figline:#B8862B;--card:#FFFFFF;--fs:19px;
  position:fixed;inset:0;z-index:2147482000;background:var(--paper);color:var(--ink);display:none;font-family:'Literata',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
#bookView.on{display:block}
#bookView[data-theme="sepia"]{--paper:#F5EBD7;--ink:#4A3524;--muted:#7A644C;--rule:#E2D2B2;--accent:#8A3A1E;--card:#FAF3E4}
#bookView[data-theme="night"]{color-scheme:dark;--paper:#121212;--ink:#E6E2DA;--muted:#A39E94;--rule:#2F2F2F;--accent:#E3A375;--fig:#A9BCE0;--figline:#C9A15A;--card:#1C1C1C}
body.book-open{overflow:hidden}
body.book-open .fab-wrap,body.book-open #sheetToggle,body.book-open #uxToast{display:none !important}
#bookView ::selection{background:rgba(184,134,43,.35)}
.bk-scroll:focus,.bk-lib:focus{outline:none}
.bk-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bk-page{max-width:36em;margin:0 auto;padding:84px 26px 140px;font-size:var(--fs);line-height:1.64}
.bk-page p{margin:0;text-indent:1.4em;hyphens:auto;-webkit-hyphens:auto}
.bk-page h2+p,.bk-page .bk-fl+p,.bk-page .bk-open+p,.bk-page p.first,.bk-page blockquote+p{text-indent:0}
.bk-page em{font-style:italic}
.bk-page blockquote{margin:1em 0 1em 1.4em;padding-left:1em;border-left:2px solid var(--rule);font-size:.94em;line-height:1.55;color:var(--ink)}
.bk-page blockquote p{text-indent:0}
@media (min-width:720px){.bk-page p{text-align:justify}}
.bk-page a{color:inherit}
/* title page and chapter opener */
.bk-title{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.bk-title .t1{font-size:.9em;font-variant:small-caps;letter-spacing:.12em;color:var(--muted);margin:0}
.bk-title h1{font-size:2.6em;line-height:1.05;font-weight:700;margin:.3em 0 .25em;letter-spacing:-.01em}
.bk-title .t2{font-style:italic;font-size:1.25em;margin:0 0 1.6em}
.bk-title .t3{font-size:.9em;color:var(--muted);max-width:26em;margin:0 auto;line-height:1.55}
.bk-open{text-align:center;padding:24px 0 30px}
.bk-open .lab{font-variant:small-caps;letter-spacing:.14em;color:var(--accent);font-size:.95em}
.bk-open h1{font-size:2.4em;line-height:1.08;font-weight:700;margin:.18em 0 .12em;letter-spacing:-.01em}
.bk-open .span{font-style:italic;color:var(--muted)}
.bk-open .orn{display:block;margin-top:18px;color:var(--figline);font-size:1.2em;letter-spacing:.6em}
.bk-drop::first-letter{float:left;font-size:3.6em;line-height:.82;font-weight:700;padding:.06em .08em 0 0;color:var(--accent)}
/* sections */
.bk-sec{scroll-margin-top:70px}
.bk-sec h2{font-size:1.32em;line-height:1.25;font-weight:600;margin:0 0 .7em;letter-spacing:-.005em}
.bk-fl{text-align:center;color:var(--figline);margin:2.2em 0 1.8em;font-size:1.1em;letter-spacing:.5em}
.bk-n{font-size:.62em;vertical-align:super;line-height:0;color:var(--accent);text-decoration:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;padding:0 .12em;cursor:pointer}
.bk-x{color:var(--accent) !important;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
/* figures */
.bk-fig{margin:1.8em -10px 1.4em;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:14px 12px 12px}
.bk-fig svg{display:block;width:100%;height:auto}
.bk-fig .nd{cursor:pointer}
.bk-fig .nd rect{fill:var(--paper);stroke:var(--fig);stroke-width:1.6}
.bk-fig .nd text{fill:var(--fig);font:600 21px 'Literata',Georgia,serif}
.bk-fig .nd:hover rect,.bk-fig .nd:focus rect{fill:var(--fig)}
.bk-fig .nd:hover text,.bk-fig .nd:focus text{fill:var(--paper)}
.bk-fig .ed{stroke:var(--figline);stroke-width:2;fill:none;opacity:.85}
.bk-fig .ed.contested{stroke-dasharray:7 6}
.bk-fig .ed.financial{stroke:var(--accent)}
/* writer figures: flow, money, timeline, compare, tree, stats */
.bk-page figure[class^="fig-"]{margin:1.9em -10px 1.6em;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:16px 16px 12px;font-size:.84em;line-height:1.45;text-align:left;font-family:'Literata',Georgia,serif}
.bk-page figure[class^="fig-"] figcaption{font-weight:600;font-size:1.02em;color:var(--ink);margin:0 0 14px;line-height:1.35}
.bk-page figure[class^="fig-"] figcaption .fnum{color:var(--accent);font-weight:700;margin-right:.35em}
.bk-page figure[class^="fig-"] p{text-indent:0 !important;text-align:left !important}
.bk-page figure[class^="fig-"] .fig-src{margin:12px 0 0;font-size:.86em;color:var(--muted);font-style:italic;border-top:1px solid var(--rule);padding-top:8px}
.bk-page figure[class^="fig-"] b{color:var(--fig);font-weight:700}
.bk-page figure[class^="fig-"] ol,.bk-page figure[class^="fig-"] ul{list-style:none}
:where(.bk-page figure[class^="fig-"]) :where(ol,ul){margin:0;padding:0}
.bk-page figure[class^="fig-"] li{background:none}
:where(.bk-page figure[class^="fig-"]) li{margin:0;padding:0;border:0}
.bk-page .fig-src .bk-n{margin-right:.3em}
.bk-page figure[class^="fig-"] .fig-src{overflow-wrap:anywhere;word-break:break-word}
/* flow and money: boxes joined by arrows */
.bk-page .fig-flow ol,.bk-page .fig-money ol{counter-reset:fs}
.bk-page .fig-flow li,.bk-page .fig-money li{counter-increment:fs;position:relative;border:1.5px solid var(--fig);border-radius:6px;background:var(--paper);padding:10px 12px 10px 46px;margin:0 0 22px}
.bk-page .fig-flow li:last-child,.bk-page .fig-money li:last-child{margin-bottom:0}
.bk-page .fig-flow li::before{content:counter(fs);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--fig);color:var(--paper);font:700 13px/24px system-ui,-apple-system,sans-serif;text-align:center}
.bk-page .fig-flow li:not(:last-child)::after,.bk-page .fig-money li:not(:last-child)::after{content:'';position:absolute;left:50%;bottom:-19px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid var(--figline);transform:translateX(-50%)}
.bk-page .fig-flow li b,.bk-page .fig-money li b{display:block;margin-bottom:2px}
.bk-page .fig-money li{padding-left:12px}
.bk-page .fig-money li::before{display:block;font:600 11px/1.3 system-ui,-apple-system,sans-serif;letter-spacing:.04em;color:var(--accent);margin-bottom:4px}
.bk-page .fig-money li:nth-child(1)::before{content:'Where it came from'}
.bk-page .fig-money li:nth-child(2)::before{content:'How it moved'}
.bk-page .fig-money li:nth-child(3)::before{content:'What multiplied it'}
.bk-page .fig-money li:nth-child(4)::before{content:'Who gained'}
.bk-page .fig-money li:nth-child(5)::before{content:'Who bore the cost'}
.bk-page .fig-money li:nth-child(4){border-color:var(--figline);border-width:2px}
.bk-page .fig-money li:nth-child(5){border-color:var(--accent);border-width:2px}
/* timeline */
.bk-page .fig-time ol{position:relative;padding-left:22px}
.bk-page .fig-time ol::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--figline)}
.bk-page .fig-time li{position:relative;padding:0 0 14px}
.bk-page .fig-time li:last-child{padding-bottom:0}
.bk-page .fig-time li::before{content:'';position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--fig)}
.bk-page .fig-time time{display:inline-block;font:700 12px/1.2 system-ui,-apple-system,sans-serif;color:var(--paper);background:var(--fig);border-radius:3px;padding:3px 7px;margin:0 8px 4px 0;vertical-align:1px}
/* comparison table */
.bk-page .fig-compare .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bk-page .fig-compare table{width:100%;border-collapse:collapse;font-size:.98em;line-height:1.4}
.bk-page .fig-compare th,.bk-page .fig-compare td{border:0;border-bottom:1px solid var(--rule);padding:8px 8px;vertical-align:top;text-align:left;background:none;color:var(--ink)}
.bk-page .fig-compare thead th{border-bottom:2px solid var(--fig);color:var(--fig);font-weight:700}
.bk-page .fig-compare tbody th{font-weight:600;color:var(--muted);width:24%}
@media (max-width:600px){.bk-page .fig-compare table.stackable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bk-page .fig-compare table.stackable,.bk-page .fig-compare table.stackable tbody,.bk-page .fig-compare table.stackable tr,.bk-page .fig-compare table.stackable th,.bk-page .fig-compare table.stackable td{display:block;width:auto}
.bk-page .fig-compare table.stackable tr{padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.bk-page .fig-compare table.stackable tbody th,.bk-page .fig-compare table.stackable td{border:0;padding:2px 0 4px}
.bk-page .fig-compare table.stackable tbody th{color:var(--ink);font-size:1.02em}
.bk-page .fig-compare table.stackable td[data-h]::before{content:attr(data-h);display:block;font:700 11.5px/1.3 system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:var(--fig);margin-top:4px}}
.bk-page .fig-compare td.yes{color:#2E6B3A;font-weight:600}
.bk-page .fig-compare td.no{color:var(--accent);font-weight:600}
#bookView[data-theme="night"] .fig-compare td.yes{color:#8FCB98}
/* power structure tree */
.bk-page .fig-tree ul ul{margin-left:14px;padding-left:16px;border-left:2px solid var(--figline)}
.bk-page .fig-tree li{position:relative;margin:8px 0 0}
.bk-page .fig-tree > ul > li{margin-top:0}
.bk-page .fig-tree ul ul > li::before{content:'';position:absolute;left:-16px;top:18px;width:14px;height:2px;background:var(--figline)}
.bk-page .fig-tree li > b{display:inline-block;border:1.5px solid var(--fig);border-radius:5px;background:var(--paper);padding:5px 9px;margin-right:6px}
.bk-page .fig-tree > ul > li > b{background:var(--fig);color:var(--paper)}
/* system architecture: stacked layers of components, joined by graded links */
.bk-page .fig-arch .arch{display:flex;flex-direction:column;gap:0}
.bk-page .fig-arch .ly{border:1.5px dashed var(--rule);border-radius:6px;padding:26px 10px 10px;position:relative;background:var(--paper)}
.bk-page .fig-arch .ly > h4{position:absolute;top:-1px;left:10px;transform:translateY(-50%);margin:0;padding:2px 8px;background:var(--fig);color:var(--paper);border-radius:3px;font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.bk-page .fig-arch .ly > p{margin:0 0 8px;font-size:.92em;color:var(--muted)}
.bk-page .fig-arch .nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bk-page .fig-arch .nd{border:1.5px solid var(--fig);border-radius:5px;background:var(--card);padding:7px 9px;min-width:0}
.bk-page .fig-arch .nd b{display:block;margin:0 0 2px;line-height:1.25}
.bk-page .fig-arch .nd span{display:block;font-size:.93em;line-height:1.35}
.bk-page .fig-arch .nd code,.bk-page .fig-arch .lk code{display:block;margin-top:5px;font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--c-teal);overflow-wrap:anywhere}
.bk-page .fig-arch .nd.pos{border-style:dotted;border-color:var(--muted)}
.bk-page .fig-arch .nd.hub{border-width:2.5px;border-color:var(--figline)}
.bk-page .fig-arch .lk{position:relative;margin:0;padding:14px 0 14px 50%;min-height:20px}
.bk-page .fig-arch .lk::before{content:'';position:absolute;left:calc(50% - 1.5px);top:0;bottom:8px;border-left:3px solid var(--fig)}
.bk-page .fig-arch .lk::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--fig)}
.bk-page .fig-arch .lk.rep::before{border-left-style:dashed}
.bk-page .fig-arch .lk.pos::before{border-left-style:dotted;border-color:var(--muted)}
.bk-page .fig-arch .lk.pos::after{border-top-color:var(--muted)}
.bk-page .fig-arch .lk.none::before{border-color:var(--accent);bottom:0;top:0;border-left-style:dashed}
.bk-page .fig-arch .lk.none::after{content:'✕';border:0;bottom:auto;top:50%;transform:translate(-50%,-50%);color:var(--accent);background:var(--card);font:700 15px/1 system-ui,sans-serif;padding:1px 2px}
.bk-page .fig-arch .lk > span{display:block;margin-left:14px;font-size:.92em;line-height:1.35}
.bk-page .fig-arch .lk > span i{font-style:normal;font:700 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.03em;padding:2px 6px;border-radius:999px;margin-right:6px;vertical-align:1px;background:var(--fig);color:var(--paper)}
.bk-page .fig-arch .lk.rep > span i{background:var(--c-teal)}
.bk-page .fig-arch .lk.pos > span i{background:var(--muted)}
.bk-page .fig-arch .lk.none > span i{background:var(--accent)}
.bk-page .fig-arch .arch-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font:500 11.5px/1.3 system-ui,-apple-system,sans-serif;color:var(--muted)}
.bk-page .fig-arch .arch-key em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.bk-page .fig-arch .arch-key em::before{content:'';width:22px;border-top:3px solid var(--fig)}
.bk-page .fig-arch .arch-key em.rep::before{border-top-style:dashed}
.bk-page .fig-arch .arch-key em.pos::before{border-top-style:dotted;border-color:var(--muted)}
.bk-page .fig-arch .arch-key em.none::before{border-top-style:dashed;border-color:var(--accent)}
.bk-page .fig-arch .arch-key em.hub::before{width:14px;height:10px;border:2.5px solid var(--figline);border-radius:3px}
@media (max-width:600px){.bk-page .fig-arch .lk{padding-left:22px}.bk-page .fig-arch .lk::before{left:6px}.bk-page .fig-arch .lk::after{left:7.5px}.bk-page .fig-arch .lk > span{margin-left:8px}}
/* key figures */
.bk-page .fig-stats dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.bk-page .fig-stats dl > div{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--fig);border-radius:4px;padding:10px 12px}
.bk-page .fig-stats dt{font:700 1.7em/1.1 'Literata',Georgia,serif;color:var(--fig);margin:0 0 4px}
.bk-page .fig-stats dd{margin:0;color:var(--ink)}
@media (max-width:600px){.bk-page figure[class^="fig-"]{margin-left:-6px;margin-right:-6px;padding:14px 12px 10px}}
.bk-cap{font-size:.78em;line-height:1.45;color:var(--muted);margin:10px 4px 0;font-style:italic}
.bk-cap b{font-style:normal;color:var(--ink)}
.bk-two{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:1.6em -10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bk-two div{padding:14px 12px;font-size:.84em;line-height:1.5}
.bk-two div+div{border-left:1px solid var(--rule)}
.bk-two h4{margin:0 0 6px;font-size:.82em;font-variant:small-caps;letter-spacing:.1em;color:var(--muted);font-weight:600}
.bk-two .bk-told p{font-style:italic}
.bk-two p{text-indent:0 !important;text-align:left !important}
@media (max-width:560px){.bk-two{grid-template-columns:1fr}.bk-two div+div{border-left:0;border-top:1px solid var(--rule)}}
.bk-acts{display:flex;flex-wrap:wrap;gap:8px;margin:1.2em 0 0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.bk-acts button{font:600 13px/1 inherit;font-family:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:9px 13px;cursor:pointer}
.bk-acts button:hover{border-color:var(--ink)}
.bk-acts .sim{color:var(--accent)}
/* end of chapter */
.bk-out h3{font-size:1.15em;font-weight:600;margin:0 0 .6em;text-align:center;font-variant:small-caps;letter-spacing:.08em;color:var(--accent)}
.bk-notes{margin-top:3em;padding-top:1.2em;border-top:1px solid var(--rule);font-size:.8em;line-height:1.5}
.bk-notes h3{font-size:1.1em;font-weight:600;margin:0 0 .8em}
.bk-notes ol{margin:0;padding-left:1.6em}
.bk-notes li{margin:0 0 .45em;word-break:break-word}
.bk-notes li:target{background:rgba(184,134,43,.18)}
.bk-next{display:block;width:100%;margin:2.6em 0 0;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:18px;font:600 1em/1.3 'Literata',Georgia,serif;cursor:pointer;text-align:center}
.bk-next small{display:block;font-size:.75em;opacity:.75;font-weight:400;margin-bottom:3px}
.bk-go{margin:1.4em auto 0;max-width:30em;text-align:center}
.bk-go .bk-next{margin:0}
.bk-go .alt{display:inline-block;margin:12px 6px 0;background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 14px/1 system-ui,-apple-system,sans-serif;cursor:pointer}
.bk-go .how{margin:.9em 0 0;font-size:.86em;color:var(--muted);text-indent:0;font-style:italic}
.bk-keep{margin:2.4em 0 0;padding:1.2em 1.1em 1.1em;border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:8px;background:var(--card);text-align:center}
.bk-keep .lab{margin:0 0 .7em;font:700 12px/1.3 system-ui,-apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-indent:0}
.bk-keep .bk-next{margin:0}
.bk-keep .alt{display:inline-block;margin:12px 0 0;background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 14px/1 system-ui,-apple-system,sans-serif;cursor:pointer}
.bk-keep .sub{margin:.8em 0 0;font-size:.85em;color:var(--muted);text-indent:0;font-style:italic}
.bk-keep.pulse .bk-next{animation:bkPulse 1.6s ease-in-out 3}
@keyframes bkPulse{0%,100%{box-shadow:0 0 0 0 rgba(138,45,31,0)}50%{box-shadow:0 0 0 8px rgba(138,45,31,.28)}}
@media (prefers-reduced-motion:reduce){.bk-keep.pulse .bk-next{animation:none}}
.bk-chs .hint{margin:-4px 0 10px;font:400 13.5px/1.4 system-ui,-apple-system,sans-serif;color:var(--muted)}
.bk-chs .row .st{display:inline-block;margin-left:6px;font:700 10.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bk-chs .row .st.done{color:var(--muted)}
.bk-chs-next{display:block;width:100%;margin:0 0 12px;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:12px 14px;text-align:left;font:600 15px/1.3 'Literata',Georgia,serif;cursor:pointer}
.bk-chs-next small{display:block;font:600 11.5px/1.3 system-ui,-apple-system,sans-serif;opacity:.75;letter-spacing:.04em}
/* chrome */
.bk-head{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:center;height:52px;padding:env(safe-area-inset-top,0) 64px 0;background:linear-gradient(var(--paper) 70%,transparent);font-size:13px;font-variant:small-caps;letter-spacing:.1em;color:var(--muted);transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-head span{overflow:hidden;text-overflow:ellipsis}
.bk-prog{position:absolute;top:0;left:0;height:2px;background:var(--accent);z-index:4;width:0;transition:width .2s}
.bk-fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font:400 30px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s,opacity .3s}
.bk-fab:focus-visible,.bk-sheet button:focus-visible,.bk-acts button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bookView.immersive .bk-head{transform:translateY(-100%);opacity:0}
#bookView.immersive .bk-fab{transform:translateY(120px);opacity:0}
.bk-hint{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--paper);font:500 13px/1.35 system-ui,sans-serif;padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.bk-hint.on{opacity:.92}
/* sheets */
.bk-shade{position:absolute;inset:0;z-index:8;background:rgba(10,8,5,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.bk-shade.on{opacity:1;pointer-events:auto}

    else if(/^[a-z]{2}\d+[a-z]?_/.test(id)) toast('That part is still being written');
    else closeBook(id);
  }

  /* ---------- the reading menu ---------- */
  function hideAll(){ sheet.classList.remove('on'); shade.classList.remove('on'); hidePop(); }
  shade.addEventListener('click', hideAll);
  function toast(t){ var el = $('bkToast'); el.textContent = t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); }, 1800); }
  function curHeading(){ var el = curSec && document.getElementById('bk-' + curSec); return el ? el.querySelector('h2').textContent : (BOOK.chapters[curCh] || {}).title; }
  function openSheet(html){ sheet.innerHTML = '<div class="grip" aria-hidden="true"></div>' + html; sheet.classList.add('on'); shade.classList.add('on'); sheet.scrollTop = 0; var f = sheet.querySelector('button,textarea'); if(f) setTimeout(function(){ try{ f.focus({preventScroll:true}); }catch(e){} }, 60); }
  function menu(){
    var marks = (ls('ots_book_marks') || []).length, notes = (ls('ots_book_notes') || []).length;
    openSheet('<h3>Reading</h3>' +
      '<button class="row" data-a="lib"><i>▥</i><span>The library<small>All volumes, search and sort</small></span></button>' +
      '<button class="row" data-a="toc"><i>☰</i><span>Contents<small>' + esc(BOOK.title) + ' · ' + BOOK.chapters.length + ' ' + esc(BOOK.unit || 'chapters') + '</small></span></button>' +
      '<button class="row" data-a="sim"><i>◉</i><span>Switch to the simulation<small>Opens the scene you are reading</small></span></button>' +
      (MAPS[BOOK.id] ? '<button class="row" data-a="epmap"><i>🕸</i><span>' + esc(MAPS[BOOK.id].n) + '<small>' + esc(MAPS[BOOK.id].d) + '</small></span></button>' : '') +
      (BOOK.id === 'baseline' ? '<button class="row" data-a="atlas"><i>🗺</i><span>' + esc(MAPS.atlas.n) + '<small>' + esc(MAPS.atlas.d) + '</small></span></button>' : '') +
      '<button class="row" data-a="mark"><i>🔖</i><span>Bookmark this page</span></button>' +
      '<button class="row" data-a="marks"><i>📑</i><span>Bookmarks<small>' + marks + ' saved</small></span></button>' +
      '<button class="row" data-a="note"><i>✎</i><span>Add a note here</span></button>' +
      '<button class="row" data-a="notes"><i>🗒</i><span>My notes<small>' + notes + ' saved · export as a text file</small></span></button>' +
      '<button class="row" data-a="chs"><i>⇆</i><span>Jump to a ' + (BOOK.unit === 'stages' ? 'stage' : BOOK.unit === 'parts' ? 'part' : 'chapter') + '<small>Every ' + (BOOK.unit === 'stages' ? 'stage' : BOOK.unit === 'parts' ? 'part' : 'chapter') + ' with its page number</small></span></button>' +
      '<div class="seg"><span>Reading</span><button data-a="md-scroll" class="' + (paged() ? '' : 'on') + '">Scroll</button><button data-a="md-pages" class="' + (paged() ? 'on' : '') + '">Turn pages</button></div>' +
      '<div class="seg"><span>Text size</span><button data-a="fs-">A−</button><button data-a="fs+">A+</button></div>' +
      '<div class="seg"><span>Page</span>' + ['paper','sepia','night'].map(function(t){ return '<button data-a="th-' + t + '" class="' + (prefs.theme === t ? 'on' : '') + '">' + t.charAt(0).toUpperCase() + t.slice(1) + '</button>'; }).join('') + '</div>' +
      '<button class="row" data-a="share"><i>↗</i><span>Share this section</span></button>' +
      '<button class="row" data-a="howto"><i>?</i><span>How to read a book here<small>A short walkthrough of the controls</small></span></button>' +
      '<button class="row" data-a="close"><i>✕</i><span>Close the book</span></button>');
  }
  function toc(){
    var h = '<h3>' + esc(BOOK.title) + '</h3><div class="bk-toc">';
    var PG = paginate(BOOK);
    BOOK.chapters.forEach(function(c, k){ h += '<div class="ch"><button data-go-ch="' + k + '"><small>' + esc(c.label) + ' · ' + esc(c.span) + ' · p. ' + PG.ch[k].start + '</small>' + esc(c.title) + '</button><ol>' +
      c.sections.map(function(s){ return '<li><button data-go="' + esc(s.s) + '" class="' + (s.s === curSec ? 'cur' : '') + '"><span style="float:right;margin-left:10px;color:var(--muted);font-size:.86em">' + PG.sec[s.s].start + '</span>' + esc(plain(s.h)) + '</button></li>'; }).join('') + '</ol></div>'; });
    openSheet(h + '</div>');
    var cu = sheet.querySelector('button.cur'); if(cu) setTimeout(function(){ sheet.scrollTop = cu.offsetTop - 120; }, 30);
  }
  function listMarks(){
    var a = ls('ots_book_marks') || [];
    openSheet('<h3>Bookmarks</h3>' + (a.length ? a.map(function(m, i){ return '<div class="bk-item"><div class="h" data-go="' + esc(m.sec) + '">' + esc(m.h) + '</div><div class="m"><span>' + esc(m.ch) + '</span><button data-del-mark="' + i + '">Remove</button></div></div>'; }).join('') : '<p class="bk-empty">No bookmarks yet. Use “Bookmark this page” while reading.</p>'));
  }
  function addNote(){
    openSheet('<h3>Note</h3><p class="bk-empty" style="padding-top:0">On: ' + esc(curHeading()) + '</p><textarea class="bk-note-ta" id="bkTa" placeholder="Write your note…"></textarea><div class="bk-btns"><button data-a="menu">Cancel</button><button class="pri" data-a="save-note">Save note</button></div><p class="bk-empty" style="font-size:13px">Notes stay in this browser on this device. Export them from “My notes.”</p>');
  }
  function listNotes(){
    var a = ls('ots_book_notes') || [];
    openSheet('<h3>My notes</h3>' + (a.length ? '<div class="bk-btns" style="margin:0 0 6px"><button class="pri" data-a="export">Export as a text file</button></div>' + a.map(function(n, i){ return '<div class="bk-item"><div class="h" data-go="' + esc(n.sec) + '">' + esc(n.h) + '</div><div class="t">' + esc(n.text) + '</div><div class="m"><span>' + new Date(n.at).toLocaleDateString() + '</span><button data-del-note="' + i + '">Delete</button></div></div>'; }).join('') : '<p class="bk-empty">No notes yet. Use “Add a note here” while reading.</p>'));
  }
  function exportNotes(){
    var a = ls('ots_book_notes') || []; if(!a.length) return;
    var txt = 'The Israel Architecture — my reading notes, exported ' + new Date().toLocaleString() + '\n\n' + a.map(function(n){ return '— ' + n.ch + ' · ' + n.h + '\n' + n.text + '\n'; }).join('\n');
    try{ var url = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'})); var l = document.createElement('a'); l.href = url; l.download = 'israel-architecture-notes.txt'; document.body.appendChild(l); l.click(); setTimeout(function(){ URL.revokeObjectURL(url); l.remove(); }, 1500); toast('Notes exported'); }
    catch(e){ try{ navigator.clipboard.writeText(txt); toast('Notes copied to clipboard'); }catch(er){} }
  }
  sheet.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]'); if(g){ goTo(g.getAttribute('data-go')); return; }
    var gc = e.target.closest('[data-go-ch]'); if(gc){ hideAll(); render(+gc.getAttribute('data-go-ch')); onScroll(); return; }
    var so = e.target.closest('[data-sim-open]'); if(so){ closeBook(so.getAttribute('data-sim-open')); return; }
    var dm = e.target.closest('[data-del-mark]'); if(dm){ var a = ls('ots_book_marks') || []; a.splice(+dm.getAttribute('data-del-mark'), 1); ls('ots_book_marks', a); listMarks(); return; }
    var dn = e.target.closest('[data-del-note]'); if(dn){ var b = ls('ots_book_notes') || []; b.splice(+dn.getAttribute('data-del-note'), 1); ls('ots_book_notes', b); listNotes(); return; }
    var x = e.target.closest('[data-a]'); if(!x) return; var a2 = x.getAttribute('data-a'), ch = BOOK.chapters[curCh] || {};
    if(a2 === 'toc') toc();
    else if(a2 === 'lib') toLibrary();
    else if(a2 === 'dismiss') hideAll();
    else if(a2 === 'menu') menu();
    else if(a2 === 'sim') closeBook(curSec || (ch.sections && ch.sections[0] && ch.sections[0].s));
    else if(a2 === 'mark'){ var m = ls('ots_book_marks') || []; m.unshift({sec:curSec || ch.sections[0].s, h:curHeading(), ch:BOOK.title + ' · ' + ch.label + ' · ' + ch.title, at:Date.now()}); ls('ots_book_marks', m.slice(0, 200)); hideAll(); toast('Bookmarked'); }
    else if(a2 === 'marks') listMarks();
    else if(a2 === 'note') addNote();
    else if(a2 === 'save-note'){ var t = ($('bkTa').value || '').trim(); if(!t){ hideAll(); return; } var nn = ls('ots_book_notes') || []; nn.unshift({sec:curSec || ch.sections[0].s, h:curHeading(), ch:BOOK.title + ' · ' + ch.label + ' · ' + ch.title, text:t, at:Date.now()}); ls('ots_book_notes', nn); hideAll(); toast('Note saved'); }
    else if(a2 === 'notes') listNotes();
    else if(a2 === 'export') exportNotes();
    else if(a2 === 'fs-' || a2 === 'fs+'){ var y0 = scroller.scrollTop / Math.max(1, scroller.scrollHeight); prefs.fs = Math.max(-3, Math.min(6, (prefs.fs || 0) + (a2 === 'fs+' ? 1 : -1))); applyPrefs(); if(paged()) relayout(); else scroller.scrollTop = y0 * scroller.scrollHeight; }
    else if(a2 === 'chs') chapters();
    else if(a2 === 'howto'){ hideAll(); window.readingTour(); }
    else if(a2 === 'md-scroll' || a2 === 'md-pages'){ var s0 = curSec; prefs.mode = a2 === 'md-pages' ? 'pages' : 'scroll'; applyPrefs(); render(curCh, s0); onScroll(); menu(); toast(paged() ? 'Reading page by page' : 'Reading as one scroll'); }
    else if(a2 === 'lmd-scroll' || a2 === 'lmd-pages'){ prefs.mode = a2 === 'lmd-pages' ? 'pages' : 'scroll'; applyPrefs(); libMenu(); }
    else if(a2 === 'lib-tour'){ hideAll(); libTour(true); }
    else if(a2 === 'lib-search'){ hideAll(); var lq = $('lbQ'); if(lq){ lq.scrollIntoView({block:'center'}); lq.focus(); } }
    else if(a2.indexOf('lth-') === 0){ prefs.theme = a2.slice(4); applyPrefs(); var tb = lib.querySelector('[data-lib-theme]'); if(tb) tb.textContent = 'Page: ' + prefs.theme.replace(/^./, function(x){ return x.toUpperCase(); }); libMenu(); }
    else if(a2.indexOf('th-') === 0){ prefs.theme = a2.slice(3); applyPrefs(); menu(); }
    else if(a2 === 'share'){ var u = location.href.split('#')[0] + '#book=' + (curSec || ''); hideAll(); if(navigator.share) navigator.share({title:BOOK.title + ' · ' + SERN(BOOK), text:curHeading(), url:u}).catch(function(){}); else { try{ navigator.clipboard.writeText(u); toast('Link copied'); }catch(er){} } }
    else if(a2 === 'epmap'){ var fr = fromRef(); hideAll(); openEpMap(BOOK && MAPS[BOOK.id] ? BOOK.id : 'epstein', fr); }
    else if(a2 === 'rdmap'){ var fr = fromRef(); hideAll(); openEpMap('road1948', fr); }
    else if(a2 === 'atlas'){ var fr = fromRef(); hideAll(); openEpMap('atlas', fr); }
    else if(a2 === 'close') closeBook(null);
  });
  /* maps open in this tab and remember where they were opened from, so Back returns to that book (and section), not the shelf */
  function fromRef(){ var inBook = view.classList.contains('on') && !view.classList.contains('lib'); return (inBook && curSec) ? curSec : (BOOK ? BOOK.id : ''); }
  function openEpMap(id, from){ var f = (MAPS[id] || MAPS.epstein).f; if(from) f += '?from=' + encodeURIComponent(from); location.href = f; }
  function libMenu(){
    openSheet('<h3>Library</h3>' +
      '<button class="row" data-a="close"><i>◉</i><span>Simulation, scene by scene<small>Back to the scene you were on</small></span></button>' +
      '<button class="row" data-a="lib-search"><i>⌕</i><span>Search the library<small>Titles, people, places, years</small></span></button>' +
      '<button class="row" data-a="epmap"><i>🕸</i><span>Epstein network map<small>The interactive map behind The Epstein Architecture</small></span></button>' +
      '<button class="row" data-a="rdmap"><i>🕸</i><span>The Road to 1948 and After network map<small>The Baseline, The Road to 1948 and The Cold War Architecture, 1694–1967</small></span></button>' +
      '<button class="row" data-a="atlas"><i>🗺</i><span>Language atlas<small>The Semitic family through time, and the Ashkenazi path through Europe</small></span></button>' +
      '<div class="seg"><span>Page</span>' + ['paper','sepia','night'].map(function(t){ return '<button data-a="lth-' + t + '" class="' + (prefs.theme === t ? 'on' : '') + '">' + t.charAt(0).toUpperCase() + t.slice(1) + '</button>'; }).join('') + '</div>' +
      '<div class="seg"><span>Reading</span><button data-a="lmd-scroll" class="' + (paged() ? '' : 'on') + '">Scroll</button><button data-a="lmd-pages" class="' + (paged() ? 'on' : '') + '">Turn pages</button></div>' +
      '<button class="row" data-a="lib-tour"><i>?</i><span>How the library works<small>Replay the short tour</small></span></button>');
  }
  $('bkFab').addEventListener('click', function(){ if(sheet.classList.contains('on')) hideAll(); else if(view.classList.contains('lib')) libMenu(); else menu(); });
  document.addEventListener('keydown', function(e){
    if(!view.classList.contains('on')) return;
    if(e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')){ if(e.key === 'Escape') e.target.blur(); return; }
    var mpg = $('mapPage'), dpg = $('dashPage'); if((mpg && getComputedStyle(mpg).display !== 'none') || (dpg && getComputedStyle(dpg).display !== 'none')) return;
    if(e.key === 'Escape'){ if(sheet.classList.contains('on') || pop.classList.contains('on')) hideAll(); else closeBook(null); e.stopImmediatePropagation(); e.preventDefault(); return; }
    if(view.classList.contains('lib')){ if(e.key === '/'){ var q = $('lbQ'); if(q){ q.focus(); e.preventDefault(); } } e.stopImmediatePropagation(); return; }
    if(paged() && !e.metaKey && !e.ctrlKey && !e.altKey && !sheet.classList.contains('on')){
      if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ turn(1); e.preventDefault(); e.stopImmediatePropagation(); return; }
      if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ turn(-1); e.preventDefault(); e.stopImmediatePropagation(); return; } }
    if(e.key === 't' || e.key === 'T'){ toc(); e.preventDefault(); }
    else if(e.key === 'l' || e.key === 'L'){ toLibrary(); e.preventDefault(); }
    else if(e.key === ']' && BOOK.chapters[curCh + 1]){ render(curCh + 1); onScroll(); }
    else if(e.key === '[' && curCh > 0){ render(curCh - 1); onScroll(); }
    e.stopImmediatePropagation();
  }, true);
  window.addEventListener('resize', function(){ if(view.classList.contains('on')) applyPrefs(); });

  /* ---------- entry points: the + menu, the chapter switcher, links ---------- */
  (function(){ var o = $('fabOptions'); if(!o) return; var b = document.createElement('button'); b.className = 'fab-option'; b.type = 'button'; b.textContent = '📖 The library';
    b.addEventListener('click', function(){ openBook(null); });  /* land on the shelf; the reader picks the book */
    o.appendChild(b); })();
  (function(){ var wp = document.querySelector('.welcome-paths'); if(!wp) return; var b = document.createElement('button'); b.className = 'path-btn'; b.type = 'button'; b.textContent = '📖 Read it as books';
    b.addEventListener('click', function(){ window.__bookOpening = true; try{ if(window.dismissWelcome) window.dismissWelcome(); }catch(e){} setTimeout(function(){ window.__bookOpening = false; openBook(null); }, 500); }); wp.appendChild(b); })();
  function fromHash(){
    var h = location.hash || '', on = view.classList.contains('on'), isLib = on && view.classList.contains('lib');
    routing = true;
    try{
      if(h === '#book' || h === '#library'){ if(!isLib) openBook(null); }
      else if(h.indexOf('#book=') === 0){
        var t = decodeURIComponent(h.slice(6)), w = where[t];
        if(w && on && !isLib && w[0] === curBook){ if(t !== curSec){ if(w[1] !== curCh) { render(w[1], secOf[t] || t); onScroll(); } else jumpTo(secOf[t] || t, false); } }
        else if(!(on && !isLib && bookIndex(t) === curBook)) openBook(t || null);
      }
      else if(on) closeBook(null);
    } finally { routing = false; }
  }
  window.addEventListener('popstate', fromHash);
  window.addEventListener('hashchange', fromHash);
  function deepEntry(){ if(!/^#(book|library)/.test(location.hash || '')) return false;
    try{ var w = $('welcomeOverlay'); if(w && getComputedStyle(w).display !== 'none' && window.dismissWelcome){ window.dismissWelcome(); w.style.display = 'none'; } }catch(e){}
    /* a shared link straight into a book: put the library underneath it, so Back lands on the shelf instead of leaving the site */
    var h0 = location.hash; if(h0.indexOf('#book=') === 0 && !(history.state && history.state.ots)){ try{ history.replaceState({ots:1}, '', base() + '#library'); history.pushState({ots:1, fromLib:true}, '', base() + h0); }catch(e){} }
    fromHash(); return true; }
  window.addEventListener('load', function(){ setTimeout(deepEntry, 700); });
  try{ if(window.parent !== window && window.parent.__bookRoute){ var r = window.parent.__bookRoute; setTimeout(function(){ try{ if(window.dismissWelcome) window.dismissWelcome(); }catch(e){} try{ window.parent.__bookRoute = null; }catch(e){} openBook(r === true ? null : r); }, 900); } }catch(e){}

  /* ---------- views: a one-time library banner in the simulation, and the last-used view on arrival ---------- */
  var BKEY = 'ots_lib_banner_v1', banner = null, bannerT = null;
  function hideBanner(now){ if(!banner) return; var b = banner; banner = null; clearTimeout(bannerT); b.classList.remove('on'); setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, now ? 0 : 500); }
  function shown(el){ return el && getComputedStyle(el).display !== 'none' && !el.hidden; }
  function simClear(){
    var b = document.body.classList; if(b.contains('book-open') || b.contains('modal-open') || b.contains('overlay-open')) return false;
    if(shown($('welcomeOverlay'))) return false;
    var t = $('tourOverlay'); if(t && t.classList.contains('active')) return false;
    var e = $('elevenOverlay'); if(e && !e.hidden) return false;
    var u = $('uxToast'); if(u && u.classList.contains('on')) return false;   /* wait for any tip to clear */
    return true;
  }
  function showBanner(){
    if(banner || ls(BKEY)) return; ls(BKEY, 1);
    banner = document.createElement('div'); banner.id = 'libBanner'; banner.setAttribute('role', 'region'); banner.setAttribute('aria-label', 'The library');
    banner.innerHTML = '<span class="lbb-ic" aria-hidden="true"></span><div><b>Prefer to read it as a book?</b><p>The same architecture is written up in the library as continuous history, with every claim sourced. Pick any volume.</p></div>' +
      '<div class="lbb-btns"><button type="button" class="pri" data-x="open">Open the library</button><button type="button" data-x="no">Not now</button></div>';
    banner.addEventListener('click', function(e){ var x = e.target.closest('[data-x]'); if(!x) return; if(x.getAttribute('data-x') === 'open'){ hideBanner(true); openBook(null); } else hideBanner(); });
    document.body.appendChild(banner); requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(banner) banner.classList.add('on'); }); });
    bannerT = setTimeout(hideBanner, 30000);
  }
  function english(){ var l = (document.documentElement.lang || 'en').toLowerCase(); return l.indexOf('es') !== 0 && l.indexOf('ar') !== 0; }
  (function waitForSim(){ var n = 0, ok = 0;
    if(ls(BKEY) || ls('ots_view')) return;   /* seen it, or already chose a view */
    var iv = setInterval(function(){ n++;
      if(ls(BKEY) || ls('ots_view') === 'library' || n > 400){ clearInterval(iv); return; }
      ok = simClear() ? ok + 1 : 0;
      if(ok >= 3 && english()){ clearInterval(iv); showBanner(); }
    }, 1000); })();
  /* the simulation's first-visit tour must not run underneath the library; it runs when the reader returns to the simulation */
  (function(){ var t = $('tourOverlay'); if(!t || !window.MutationObserver) return;
    new MutationObserver(function(){ if(t.classList.contains('active') && document.body.classList.contains('book-open')) t.classList.remove('active'); }).observe(t, {attributes:true, attributeFilter:['class']}); })();
  /* arrive in the view the reader used last. The library is the default: only a reader who last left in the
     simulation goes back to it. A link to a scene, dashboard, map or Eleven Minutes still wins. The welcome
     screen is retired: it never shows, and the + menu no longer offers it. Lives here (not only in
     tools/library_boot.py) so re-embedding the book keeps it. */
  window.__welcomeReopen = function(){};
  function libBootDone(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(window.__otsBootOff) window.__otsBootOff(); else document.documentElement.classList.remove('ots-lib-boot'); }); }); }
  function libBoot(){
    try{ var w0 = $('welcomeOverlay'); if(w0){ if(window.dismissWelcome) window.dismissWelcome(); w0.style.display = 'none'; } }catch(e){}
    if(/^#(book|library)/.test(location.hash || '')){ try{ deepEntry(); }catch(e){} return libBootDone(); }
    if(ls('ots_view') === 'sim' || view.classList.contains('on')) return libBootDone();
    if((location.hash || '').replace('#', '')) return libBootDone();
    var ev = $('elevenOverlay'); if(ev && !ev.hidden) return libBootDone();
    try{ if(window.parent !== window && (window.parent.__bookRoute || window.parent.__elevenRoute)) return libBootDone(); }catch(e){}
    bootOpen = true; try{ openBook(null); }catch(e){} bootOpen = false;
    libBootDone();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(libBoot, 0); });
  else setTimeout(libBoot, 0);
})();
</script>
